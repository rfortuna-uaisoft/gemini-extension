<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Gemini Tweaks</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1><span class="logo" aria-hidden="true">✦</span> Gemini Tweaks</h1>
    <label class="switch" title="Liga/desliga todas as mudanças">
      <input type="checkbox" role="switch" data-key="enabled" aria-label="Ativar Gemini Tweaks"><span></span>
    </label>
  </header>

  <main id="opcoes">
    <section data-sec="widthOn">
      <div class="titulo">
        <h2>Largura da conversa</h2>
        <label class="switch"><input type="checkbox" role="switch" data-key="widthOn" aria-label="Ativar largura"><span></span></label>
      </div>
      <label class="linha">
        <span>Largura <output data-out="width" data-suf="px"></output></span>
        <input type="range" min="708" max="1800" step="20" data-key="width">
      </label>
      <label class="check"><input type="checkbox" data-key="alignInput"> Caixa de mensagem acompanha a largura</label>
    </section>

    <section data-sec="fontOn">
      <div class="titulo">
        <h2>Fontes</h2>
        <label class="switch"><input type="checkbox" role="switch" data-key="fontOn" aria-label="Ativar fontes"><span></span></label>
      </div>
      <label class="linha"><span>Texto</span><select data-key="fontText" id="fontText"></select></label>
      <label class="linha"><span>Código</span><select data-key="codeFont" id="codeFont"></select></label>
      <label class="linha">
        <span>Tamanho <output data-out="fontSize" data-suf="px"></output></span>
        <input type="range" min="12" max="22" step="1" data-key="fontSize">
      </label>
      <label class="linha">
        <span>Espaço entre linhas <output data-out="lineHeight"></output></span>
        <input type="range" min="1.3" max="2" step="0.05" data-key="lineHeight">
      </label>
    </section>

    <section data-sec="themeOn">
      <div class="titulo">
        <h2>Tema (modo escuro)</h2>
        <label class="switch"><input type="checkbox" role="switch" data-key="themeOn" aria-label="Ativar tema"><span></span></label>
      </div>
      <div id="temas" role="group" aria-label="Escolha o tema"></div>
    </section>

    <section>
      <div class="titulo"><h2>Outros</h2></div>
      <label class="check"><input type="checkbox" data-key="hideDisclaimer"> Esconder o aviso “Gemini pode cometer erros”</label>
    </section>

    <button id="restaurar" type="button">Restaurar padrões</button>
  </main>

  <script src="defaults.js"></script>
  <script src="popup.js"></script>
</body>
</html>
